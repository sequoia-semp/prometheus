- id: W-025
  title: Full read-only semantic agent harness
  milestone: M4
  priority: P0
  status: planned
  depends_on: [W-014, W-026]
  objective: Implement the broader read-only semantic/agent harness after fixture evidence-binding is proven.
  adrs: [ADR-025, ADR-034]
  contracts: [AGENT_LOOP.md, AGENT_TOOLS.md, TRADE_INTENT.md]
  acceptance:
  - Conforms to AGENT_LOOP.md and AGENT_TOOLS.md.
  - Agent tools are typed and whitelisted.
  - Agent cannot answer numerical questions without tool output and lineage.
