- id: W-N1
  title: Nautilus replay go/no-go spike
  milestone: M4
  priority: P1
  status: planned
  depends_on: [W-014, W-016]
  objective: Evaluate NautilusTrader as adapter/runtime spine without making it authoritative prematurely.
  adrs: [ADR-014]
  contracts: [EVENT_ENVELOPE.md, PRICER.md]
  acceptance:
